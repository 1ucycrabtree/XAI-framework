services:
  xai-robustness:
    build:
      context: .
      dockerfile: Dockerfile
    image: xai-robustness:latest
    container_name: xai-fraud-detection
    volumes:
      - ./xai_framework:/framework/xai_framework
      - ./scripts:/framework/scripts
      - ./config:/framework/config
      - ./data:/framework/data
      # Ignore cache directories
      - /framework/xai_framework/__pycache__
      - /framework/xai_framework/.ruff_cache
    environment:
      - PYTHONPATH=/framework:/framework/xai_framework
    stdin_open: true
    tty: true
