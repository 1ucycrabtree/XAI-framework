services:
  xai-robustness:
    build:
      context: .
      dockerfile: Dockerfile
    image: xai-robustness:latest
    container_name: xai-fraud-detection
    volumes:
      - ./xai_framework:/app/xai_framework
      - ./config:/app/config
      - ./data:/app/data
      # Ignore cache directories
      - /app/xai_framework/__pycache__
      - /app/xai_framework/.ruff_cache
    environment:
      - PYTHONPATH=/app/xai_framework
    stdin_open: true
    tty: true
