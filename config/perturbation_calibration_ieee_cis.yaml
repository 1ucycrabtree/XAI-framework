base_xai_config: "default.yaml"

output_dir: "results/perturbation_calibration_design"
random_seed: 42

sample_groups: ["TP", "FP"]
samples_per_group: 50
n_perturbations_per_sample: 5

perturbations:
  local_gaussian_noise:
    enabled: true
    lambdas: [0.05, 0.1, 0.2, 0.5, 1.0, 5.0]

  directional_drift:
    enabled: true
    target_features: ["TransactionAmt"]
    drift_factor_ranges:
      - [0.01, 0.05]
      - [0.10, 0.20]
      - [0.20, 0.40]
      - [0.40, 0.60]
      - [0.80, 1.00]

  top_k_features:
    enabled: true
    lambdas: [0.20]
    ks: [1, 2, 3, 5, 6]


analysis:
  use_gower_distance: true
  locality_thresholds:
    too_local_max_gower: 0.01
    too_far_min_gower: 0.20
