dataset:
  train_file_path: "data/processed/train_val_final.parquet"
  test_file_path: "data/processed/test_final.parquet"
  target_label: isFraud
  categorical_features: [
        "ProductCD",
        "card4",
        "card6",
        "addr1",
        "P_emaildomain",
        "R_emaildomain",
        "M1",
        "M2",
        "M3",
        "M4",
        "M5",
        "M6",
        "M7",
        "M8",
        "M9",
        "id_12",
        "id_15",
        "id_30",
        "id_31",
        "id_33",
        "id_34",
        "id_35",
        "id_36",
        "id_37",
        "id_38",
        "DeviceType",
        "DeviceInfo"
    ]
  non_negative_features:
    - TransactionAmt
  non_negative_prefixes:
    - C
    - D
  perturbable_categorical_features:
  - ProductCD
  - card4
  - card6
  - addr1
  perturbable_numerical_features:
  - TransactionAmt
  - dist1

model:
  architecture: CatBoost
  file_path: "data/models/catboost_fraud_model_lr0.01_depth10_2026-03-20_192829.cbm"
  metadata:
    name: "CatBoost Fraud Model"
    decision_threshold: 0.2543702382820814

explainer:
  method: TabularLIME
  params:
    class_names: ["Fraud", "NotFraud"]
    random_seed: 42
    discretize_continuous: True
    kernel_width: 1.0
    num_samples: 2000
    auto_detect_binary: True
    impute_strategy: median

perturbations:
  - name: LocalGaussianNoise
    n_perturbations: 3
    random_seed: 42
    params:
      lambda: 0.2
  # - name: DirectionalDrift
  #   n_perturbations: 3
  #   random_seed: 42
  #   params:
  #     drift_factor: 0.2
  #     drift_factor_range: [0.2, 0.4]
  #     target_features: ["TransactionAmt"]
  # - name: TopKFeatures
  #   n_perturbations: 3
  #   random_seed: 42
  #   params:
  #     k: 2
  #     lambda: 0.2

metrics:
  - name: RelativeInputStability
  - name: RankBiasedOverlap
    params:
      W: 0.9
      d: 5
  - name: SignConsistencyRate

experiment:
  name: TabularLIME_AnotherTest_TP
  type: DissertationExperiment
  sample_size: 20
  sample_group: TP
  random_seed: 42
  chunk_size: 10
  max_workers: 1
  resume: true
  checkpoint_dir: "results/checkpoints"
  results_dir: "results"
