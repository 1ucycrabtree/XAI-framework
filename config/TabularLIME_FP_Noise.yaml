dataset:
  train_file_path: "data/processed/train_val_final.parquet"
  test_file_path: "data/processed/test_final.parquet"
  target_label: isFraud
  categorical_features: [
        "ProductCD",
        "card4",
        "card6",
        "addr1",
        "P_emaildomain",
        "R_emaildomain",
        "M1",
        "M2",
        "M3",
        "M4",
        "M5",
        "M6",
        "M7",
        "M8",
        "M9",
        "id_12",
        "id_15",
        "id_30",
        "id_31",
        "id_33",
        "id_34",
        "id_35",
        "id_36",
        "id_37",
        "id_38",
        "DeviceType",
        "DeviceInfo"
    ]
  non_negative_features:
    - TransactionAmt
  non_negative_prefixes:
    - C
    - D
  perturbable_categorical_features:
  - ProductCD
  - card4
  - card6
  - addr1
  perturbable_numerical_features:
  - TransactionAmt
  - dist1

model:
  architecture: CatBoost
  file_path: "data/models/catboost_fraud_model_lr0.01_depth10.cbm"
  metadata:
    name: "CatBoost Fraud Model"

explainer:
  method: TabularLIME
  params:
    class_names: ["Fraud", "NotFraud"]
    random_seed: 42
    discretize_continuous: True
    kernel_width: 2.0
    num_samples: 500
    auto_detect_binary: True
    impute_strategy: median

perturbations:
  - name: LocalGaussianNoise
    n_perturbations: 20
    random_seed: 42
    params:
      lambda: 0.2

metrics:
  - name: RelativeInputStability
  - name: RankBiasedOverlap
  - name: SignConsistencyRate
  - name: GlobalConsistencyMetric
  - name: GlobalSufficiencyMetric

experiment:
  name: DissertationExperiment_TabularLIME_FP_Noise
  type: DissertationExperiment
  sample_size: 500
  sample_group: FP
  random_seed: 42
  chunk_size: 20
  max_workers: 4
  resume: true
  checkpoint_dir: "results/checkpoints"
  results_dir: "results"