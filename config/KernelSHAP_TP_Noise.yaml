dataset:
  train_file_path: "data/processed/splits/train_dataset_2026-03-07_13:29:54.parquet"
  test_file_path: "data/processed/splits/test_dataset_2026-03-07_13:29:54.parquet"
  target_label: isFraud
  drop_columns:
    - TransactionID
    - TransactionDT
  metadata:
    name: "IEEE-CIS Fraud Detection"
    type: cleaned

model:
  architecture: CatBoost
  file_path: "data/models/catboost_model_cleaned_2026-01-28_22:03:17.cbm"
  metadata:
    name: "CatBoost Fraud Model"

explainer:
  method: KernelSHAP
  params:
    background_samples: 30
    n_samples: 500
    random_seed: 42


perturbations:
  - name: LocalGaussianNoise
    n_perturbations: 10
    random_seed: 42
    params:
      lambda: 0.5

metrics:
  - name: RelativeInputStability
  - name: RankBiasedOverlap
  - name: SignConsistencyRate
  - name: GlobalConsistencyMetric
  - name: GlobalSufficiencyMetric

experiment:
  name: BaselineExperiment_KernelSHAP_TP_Noise
  type: BaselineExperiment
  sample_size: 1000
  sample_group: TP
  random_seed: 42
  chunk_size: 20
  max_workers: 1
  resume: true
  checkpoint_dir: "results/checkpoints"
  results_dir: "results"
